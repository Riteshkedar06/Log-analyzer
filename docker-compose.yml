version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: auth-postgres

    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7

    ports:
      - "6379:6379"

    command: redis-server --appendonly yes

volumes:
  postgres_data:
